      const [projectName, setProjectName] = useState('');
      const [incomes, setIncomes] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [expenseCategories, setExpenseCategories] = useState(INITIAL_CATEGORIES);
      const [salesRatio, setSalesRatio] = useState(100);
      const [targetMarginInput, setTargetMarginInput] = useState('20');
      const [chartType, setChartType] = useState('pie'); 
      const [expenseFilterCategory, setExpenseFilterCategory] = useState('ALL');
      
      // サークル費・割り勘管理用ステート
      const [subsidyAmount, setSubsidyAmount] = useState(10000);
      const [memberCount, setMemberCount] = useState(25);
      const [perMemberFee, setPerMemberFee] = useState(1000);

      const [isLoaded, setIsLoaded] = useState(false);
      const [isDirty, setIsDirty] = useState(false);
      const [lastSavedData, setLastSavedData] = useState('');

      // リロード・離脱防止機能のステート（デフォルト有効）
      const [warnOnReload, setWarnOnReload] = useState(() => {
        const saved = safeStorage.getItem('festival_warn_reload');
        return saved !== null ? saved === 'true' : true;
      });

      // モーダル制御ステート
      const [showHelpModal, setShowHelpModal] = useState(false);
      const [showPresetModal, setShowPresetModal] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [showCategoryModal, setShowCategoryModal] = useState(false);
      const [showMessageModal, setShowMessageModal] = useState({ show: false, title: '', message: '' });
      const [showReloadModal, setShowReloadModal] = useState(false);
      
      const [showExportModal, setShowExportModal] = useState(false);
      const [exportFileName, setExportFileName] = useState('');
      const [exportType, setExportType] = useState('json');
      const [exportMode, setExportMode] = useState('file'); 
      
      const [showImportModal, setShowImportModal] = useState(false);
      const [importText, setImportText] = useState('');

      const fileInputRef = useRef(null);

      useEffect(() => {
        const savedIncomes = safeStorage.getItem('festival_incomes');
        const savedExpenses = safeStorage.getItem('festival_expenses');
        const savedCategories = safeStorage.getItem('festival_categories');
        const savedMeta = safeStorage.getItem('festival_meta');
        
        if (savedIncomes && savedExpenses) {
          try {
            const parsedIncomes = JSON.parse(savedIncomes);
            const parsedExpenses = JSON.parse(savedExpenses);
            const parsedCategories = savedCategories ? JSON.parse(savedCategories) : INITIAL_CATEGORIES;
            const parsedMeta = savedMeta ? JSON.parse(savedMeta) : {};

            const finalIncomes = parsedIncomes.length > 0 ? parsedIncomes : createEmptyIncome();
            const finalExpenses = parsedExpenses.length > 0 ? parsedExpenses : createEmptyExpense(parsedCategories);

            setIncomes(finalIncomes);
            setExpenses(finalExpenses);
            setExpenseCategories(parsedCategories);
            if (parsedMeta.projectName !== undefined) setProjectName(parsedMeta.projectName);
            if (parsedMeta.subsidyAmount !== undefined) setSubsidyAmount(parsedMeta.subsidyAmount);
            if (parsedMeta.memberCount !== undefined) setMemberCount(parsedMeta.memberCount);
            if (parsedMeta.perMemberFee !== undefined) setPerMemberFee(parsedMeta.perMemberFee);
            if (parsedMeta.salesRatio !== undefined) setSalesRatio(parsedMeta.salesRatio);
            
            setLastSavedData(JSON.stringify({
              projectName: parsedMeta.projectName || '',
              incomes: finalIncomes,
              expenses: finalExpenses,
              categories: parsedCategories,
              salesRatio: parsedMeta.salesRatio ?? 100,
              subsidyAmount: parsedMeta.subsidyAmount ?? 10000,
              memberCount: parsedMeta.memberCount ?? 25,
              perMemberFee: parsedMeta.perMemberFee ?? 1000
            }));
          } catch (e) {
            handleInitializeData();
          }
        } else {
          handleInitializeData();
        }
        setIsLoaded(true);
      }, []);

      useEffect(() => {
        if (isLoaded) {
          safeStorage.setItem('festival_incomes', JSON.stringify(incomes));
          safeStorage.setItem('festival_expenses', JSON.stringify(expenses));
          safeStorage.setItem('festival_categories', JSON.stringify(expenseCategories));
          safeStorage.setItem('festival_meta', JSON.stringify({
            projectName,
            salesRatio,
            subsidyAmount,
            memberCount,
            perMemberFee
          }));

          const currentDataStr = JSON.stringify({
            projectName,
            incomes,
            expenses,
            categories: expenseCategories,
            salesRatio,
            subsidyAmount,
            memberCount,
            perMemberFee
          });
          setIsDirty(currentDataStr !== lastSavedData);
        }
      }, [projectName, incomes, expenses, expenseCategories, salesRatio, subsidyAmount, memberCount, perMemberFee, isLoaded, lastSavedData]);

      // リロード警告設定の永続化
      useEffect(() => {
        safeStorage.setItem('festival_warn_reload', String(warnOnReload));
      }, [warnOnReload]);

      // ブラウザ更新・タブ閉じ時の標準ネイティブ警告（beforeunload）
      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (!warnOnReload) return;
          e.preventDefault();
          e.returnValue = ''; // クロスブラウザ対応用の標準構文
          return '';
        };

        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [warnOnReload]);

      // キーボードショートカット（F5、Ctrl+R、Cmd+R）を検知して専用モーダルを表示
      useEffect(() => {
        const handleKeyDown = (e) => {
          const isReloadShortcut = e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'));
          if (isReloadShortcut && warnOnReload) {
            e.preventDefault();
            setShowReloadModal(true);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [warnOnReload]);

      // モーダルから安全にリロードを実行する関数
      const handleConfirmReload = () => {
        setWarnOnReload(false);
        setShowReloadModal(false);
        setTimeout(() => {
          window.location.reload();
        }, 30);
      };

      const createEmptyIncome = () => [{ id: generateId(), name: '', price: '', quantity: '' }];
      const createEmptyExpense = (cats = expenseCategories) => [{ id: generateId(), name: '', category: cats[0] || '', price: '', quantity: '', purchased: false, note: '', url: '', links: [] }];

      const handleInitializeData = () => {
        const initIncomes = createEmptyIncome();
        const initExpenses = createEmptyExpense(INITIAL_CATEGORIES);
        setProjectName('');
        setIncomes(initIncomes);
        setExpenses(initExpenses);
        setExpenseCategories(INITIAL_CATEGORIES);
        setSalesRatio(100);
        setTargetMarginInput('20');
        setSubsidyAmount(10000);
        setMemberCount(25);
        setPerMemberFee(1000);
        setExpenseFilterCategory('ALL');
        
        setLastSavedData(JSON.stringify({
          projectName: '',
          incomes: initIncomes,
          expenses: initExpenses,
          categories: INITIAL_CATEGORIES,
          salesRatio: 100,
          subsidyAmount: 10000,
          memberCount: 25,
          perMemberFee: 1000
        }));
        setIsDirty(false);
      };

      const applyPresetTemplate = (preset) => {
        const newIncomes = preset.incomes.map(item => ({ id: generateId(), ...item }));
        const newExpenses = preset.expenses.map(item => ({ id: generateId(), ...item }));
        setProjectName(preset.projectName);
        setIncomes(newIncomes);
        setExpenses(newExpenses);
        setExpenseCategories(INITIAL_CATEGORIES);
        setSubsidyAmount(preset.subsidy);
        setMemberCount(preset.memberCount);
        setPerMemberFee(preset.perMemberFee);
        setSalesRatio(100);
        setExpenseFilterCategory('ALL');
        setShowPresetModal(false);
        setShowMessageModal({
          show: true,
          title: 'サンプルを適用しました',
          message: `「${preset.title}」の予算データを読み込みました。自由に数値を変更してシミュレーションできます。`
        });
      };

      const addIncome = () => setIncomes([...incomes, { id: generateId(), name: '', price: '', quantity: '' }]);
      const duplicateIncome = (item) => {
        const idx = incomes.findIndex(i => i.id === item.id);
        const clone = { ...item, id: generateId(), name: item.name ? `${item.name} (コピー)` : '' };
        const next = [...incomes];
        next.splice(idx + 1, 0, clone);
        setIncomes(next);
      };
      const removeIncome = (id) => {
        const next = incomes.filter(item => item.id !== id);
        setIncomes(next.length > 0 ? next : createEmptyIncome());
      };
      const updateIncome = (id, field, value) => setIncomes(incomes.map(item => item.id === id ? { ...item, [field]: value } : item));

      const addExpense = () => {
        const defaultCat = expenseFilterCategory !== 'ALL' ? expenseFilterCategory : (expenseCategories[0] || '');
        setExpenses([...expenses, { id: generateId(), name: '', category: defaultCat, price: '', quantity: '', purchased: false, note: '', url: '', links: [] }]);
      };
      const duplicateExpense = (item) => {
        const idx = expenses.findIndex(e => e.id === item.id);
        const cloneLinks = Array.isArray(item.links) ? item.links.map(l => ({ ...l, id: generateId() })) : [];
        const clone = { ...item, id: generateId(), name: item.name ? `${item.name} (コピー)` : '', links: cloneLinks };
        const next = [...expenses];
        next.splice(idx + 1, 0, clone);
        setExpenses(next);
      };
      const removeExpense = (id) => {
        const next = expenses.filter(item => item.id !== id);
        setExpenses(next.length > 0 ? next : createEmptyExpense());
      };
      const updateExpense = (id, field, value) => setExpenses(expenses.map(item => item.id === id ? { ...item, [field]: value } : item));

      const addExpenseSubLink = (expenseId) => {
        setExpenses(expenses.map(item => {
          if (item.id !== expenseId) return item;
          const currentLinks = Array.isArray(item.links) ? item.links : [];
          return {
            ...item,
            links: [...currentLinks, { id: generateId(), label: '', url: '' }]
          };
        }));
      };

      const updateExpenseSubLink = (expenseId, linkId, field, value) => {
        setExpenses(expenses.map(item => {
          if (item.id !== expenseId) return item;
          const currentLinks = Array.isArray(item.links) ? item.links : [];
          return {
            ...item,
            links: currentLinks.map(l => l.id === linkId ? { ...l, [field]: value } : l)
          };
        }));
      };

      const removeExpenseSubLink = (expenseId, linkId) => {
        setExpenses(expenses.map(item => {
          if (item.id !== expenseId) return item;
          const currentLinks = Array.isArray(item.links) ? item.links : [];
          return {
            ...item,
            links: currentLinks.filter(l => l.id !== linkId)
          };
        }));
      };

      const appendExpenseNoteTag = (expenseId, tagText) => {
        setExpenses(expenses.map(item => {
          if (item.id !== expenseId) return item;
          const current = (item.note || '').trim();
          if (current.includes(tagText)) return item;
          const nextNote = current ? `${current} / ${tagText}` : tagText;
          return { ...item, note: nextNote };
        }));
      };

      const calculations = useMemo(() => {
        const expectedIncome = incomes.reduce((sum, item) => sum + ((Number(item.price) || 0) * (Number(item.quantity) || 0)), 0);
        const totalPlannedUnits = incomes.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
        const simulatedUnits = incomes.reduce((sum, item) => sum + Math.floor((Number(item.quantity) || 0) * (salesRatio / 100)), 0);

        const simulatedIncome = incomes.reduce((sum, item) => {
          const simulatedQuantity = Math.floor((Number(item.quantity) || 0) * (salesRatio / 100));
          return sum + ((Number(item.price) || 0) * simulatedQuantity);
        }, 0);
        const totalExpense = expenses.reduce((sum, item) => sum + ((Number(item.price) || 0) * (Number(item.quantity) || 0)), 0);
        const purchasedExpense = expenses.filter(e => e.purchased).reduce((sum, item) => sum + ((Number(item.price) || 0) * (Number(item.quantity) || 0)), 0);
        
        const expectedProfit = expectedIncome - totalExpense;
        const simulatedProfit = simulatedIncome - totalExpense;
        const expectedProfitMargin = expectedIncome > 0 ? (expectedProfit / expectedIncome) * 100 : 0;
        const simulatedProfitMargin = simulatedIncome > 0 ? (simulatedProfit / simulatedIncome) * 100 : 0;

        const breakEvenRatio = expectedIncome > 0 ? (totalExpense / expectedIncome) * 100 : 0;

        const totalInitialFund = (Number(subsidyAmount) || 0) + ((Number(memberCount) || 0) * (Number(perMemberFee) || 0));
        const fundBalance = totalInitialFund - totalExpense;
        const requiredPerMemberToCoverExpense = (Number(memberCount) || 0) > 0
          ? Math.max(0, Math.ceil((totalExpense - (Number(subsidyAmount) || 0)) / Number(memberCount)))
          : 0;
        const profitPerMember = (Number(memberCount) || 0) > 0
          ? Math.floor(simulatedProfit / Number(memberCount))
          : 0;

        return {
          expectedIncome,
          simulatedIncome,
          totalExpense,
          purchasedExpense,
          expectedProfit,
          simulatedProfit,
          expectedProfitMargin,
          simulatedProfitMargin,
          breakEvenRatio,
          totalPlannedUnits,
          simulatedUnits,
          totalInitialFund,
          fundBalance,
          requiredPerMemberToCoverExpense,
          profitPerMember
        };
      }, [incomes, expenses, salesRatio, subsidyAmount, memberCount, perMemberFee]);

      const categorySummary = useMemo(() => {
        const summary = expenseCategories.map(cat => {
          const total = expenses.filter(e => e.category === cat).reduce((sum, e) => sum + ((Number(e.price) || 0) * (Number(e.quantity) || 0)), 0);
          return { name: cat, total };
        });
        const unclassifiedTotal = expenses.filter(e => !expenseCategories.includes(e.category)).reduce((sum, e) => sum + ((Number(e.price) || 0) * (Number(e.quantity) || 0)), 0);
        if (unclassifiedTotal > 0) summary.push({ name: '未分類', total: unclassifiedTotal });
        summary.sort((a, b) => b.total - a.total);
        return summary;
      }, [expenses, expenseCategories]);

      const diagnosticAdvices = useMemo(() => {
        const list = [];
        const { expectedIncome, totalExpense, breakEvenRatio, fundBalance, totalPlannedUnits } = calculations;

        if (expectedIncome === 0 && totalExpense === 0) {
          list.push({
            type: 'info',
            title: 'まずはデータを入れてみましょう',
            text: '右上の「サンプル読込」ボタンを押すと、焼きそば模擬店やカフェなどのリアルな予算例をワンクリックで試せます。'
          });
          return list;
        }

        if (breakEvenRatio > 100) {
          list.push({
            type: 'danger',
            title: '計画通り(100%)売れても赤字になる設定です',
            text: `損益分岐点が達成率 ${breakEvenRatio.toFixed(1)}% となっています。販売単価を引き上げるか、予定数量を増やす、または経費を削減してください。`
          });
        } else if (breakEvenRatio > 80) {
          list.push({
            type: 'warning',
            title: `損益分岐点が高めです（達成率 ${breakEvenRatio.toFixed(1)}% でトントン）`,
            text: '雨天や時間帯によって8割以下の売れ行きになると赤字になるリスクがあります。単価を+30〜50円上げるか、固定費（装飾・備品）を抑えると安全性が高まります。'
          });
        } else if (breakEvenRatio > 0) {
          list.push({
            type: 'success',
            title: `健全な損益分岐ラインです（達成率 ${breakEvenRatio.toFixed(1)}% 以上で黒字）`,
            text: `予定の約 ${Math.ceil(breakEvenRatio)}% 売れれば元が取れるため、天候不良や売れ残りリスクに対しても余裕のある計画です。`
          });
        }

        if (fundBalance < 0) {
          list.push({
            type: 'warning',
            title: `初期資金（サークル費＋個人集金）に対して経費が ${new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(Math.abs(fundBalance))} 不足しています`,
            text: `買い出し時の立替払いが苦しくなる可能性があります。1人あたり集金額を約 ¥${calculations.requiredPerMemberToCoverExpense.toLocaleString()} に増やすか、サークル費からの補填・経費見直しを検討しましょう。`
          });
        }

        if (totalPlannedUnits > 0 && totalExpense > 0) {
          const avgCostPerUnit = Math.round(totalExpense / totalPlannedUnits);
          const avgPricePerUnit = Math.round(expectedIncome / totalPlannedUnits);
          list.push({
            type: 'info',
            title: `1個（1人）あたりの平均原価は ¥${avgCostPerUnit.toLocaleString()} / 平均販売価格は ¥${avgPricePerUnit.toLocaleString()}`,
            text: `1つ売れるごとに平均 ¥${(avgPricePerUnit - avgCostPerUnit).toLocaleString()} の利益（粗利）が生まれる計算です。`
          });
        }

        return list;
      }, [calculations]);

      const formatCurrency = (amount) => new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(amount);

      const getValidUrl = (rawUrl) => {
        if (!rawUrl || !rawUrl.trim()) return '';
        const trimmed = rawUrl.trim();
        if (/^https?:\/\//i.test(trimmed)) return trimmed;
        return `https://${trimmed}`;
      };

      const calculateRequiredSales = (targetMarginPercent) => {
        const expense = calculations.totalExpense;
        const expectedIncome = calculations.expectedIncome;

        if (expense === 0) {
          setShowMessageModal({ show: true, title: 'エラー', message: '経費が入力されていません。先に「経費計画」を入力してください。' });
          return;
        }
        if (expectedIncome === 0) {
          setShowMessageModal({ show: true, title: 'エラー', message: '販売計画（売上目標）が入力されていません。' });
          return;
        }
        if (targetMarginPercent >= 100) {
          setShowMessageModal({ show: true, title: 'エラー', message: '100%以上の利益率は設定できません。' });
          return;
        }

        const requiredIncome = expense / (1 - (targetMarginPercent / 100));
        const requiredRatio = (requiredIncome / expectedIncome) * 100;
        
        setSalesRatio(Math.max(0, Math.round(requiredRatio)));
      };

      const handleReverseCalculate = () => calculateRequiredSales(Number(targetMarginInput) || 0);
      const handleBreakEven = () => {
        setTargetMarginInput('0');
        calculateRequiredSales(0);
      };

      const generateCSV = () => {
        let csv = '\uFEFF'; 
        csv += '【学園祭 予算シミュレーション結果】\n';
        if (projectName) csv += `サークル・企画名,"${projectName.replace(/"/g, '""')}"\n`;
        csv += `出力日時,${new Date().toLocaleString()}\n\n`;
        
        csv += `[全体サマリー]\n`;
        csv += `目標達成率,${salesRatio}%\n`;
        csv += `総売上(見込),${calculations.simulatedIncome}\n`;
        csv += `総経費,${calculations.totalExpense}\n`;
        csv += `最終利益(見込),${calculations.simulatedProfit}\n`;
        csv += `利益率,${calculations.simulatedProfitMargin.toFixed(1)}%\n`;
        csv += `損益分岐点達成率,${calculations.breakEvenRatio.toFixed(1)}%\n`;
        csv += `初期資金合計(サークル費+個人集金),${calculations.totalInitialFund}\n\n`;

        csv += `[販売計画（売上）]\n`;
        csv += `商品名,単価,予定数(100%),シミュレーション販売数(${salesRatio}%),小計(100%),シミュレーション小計\n`;
        incomes.forEach(item => {
          const price = Number(item.price) || 0;
          const qty = Number(item.quantity) || 0;
          const simQty = Math.floor(qty * (salesRatio / 100));
          csv += `"${(item.name || '').replace(/"/g, '""')}",${price},${qty},${simQty},${price * qty},${price * simQty}\n`;
        });
        csv += `\n`;

        csv += `[経費計画（支出）]\n`;
        csv += `購入済,購入品目,カテゴリ,単価,数量,小計,備考・メモ,参考URL\n`;
        expenses.forEach(item => {
          const price = Number(item.price) || 0;
          const qty = Number(item.quantity) || 0;
          const noteStr = (item.note || '').replace(/"/g, '""');
          const subLinks = Array.isArray(item.links)
            ? item.links.filter(l => l.url && l.url.trim()).map(l => l.label ? `${l.label}: ${l.url}` : l.url)
            : [];
          const allUrls = [item.url, ...subLinks].filter(Boolean).join(' | ').replace(/"/g, '""');
          csv += `${item.purchased ? '済' : '未'},"${(item.name || '').replace(/"/g, '""')}","${(item.category || '').replace(/"/g, '""')}",${price},${qty},${price * qty},"${noteStr}","${allUrls}"\n`;
        });
        
        return csv;
      };

      const handleExecuteExport = () => {
        try {
          const dataToExport = {
            version: '1.4',
            date: new Date().toISOString(),
            projectName,
            incomes,
            expenses,
            categories: expenseCategories,
            salesRatio,
            subsidyAmount,
            memberCount,
            perMemberFee
          };
          const jsonString = JSON.stringify(dataToExport, null, 2);
          const csvString = generateCSV();

          if (exportMode === 'text') {
            const textToCopy = exportType === 'json' ? jsonString : csvString;
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            setLastSavedData(JSON.stringify({
              projectName,
              incomes,
              expenses,
              categories: expenseCategories,
              salesRatio,
              subsidyAmount,
              memberCount,
              perMemberFee
            }));
            setIsDirty(false);
            
            setShowExportModal(false);
            setShowMessageModal({ show: true, title: 'コピー成功', message: 'データをクリップボードにコピーしました。メモ帳やLINE等に貼り付けて保管してください。' });
            return;
          }

          const defaultName = `${projectName ? projectName + '_' : ''}学園祭予算データ_${new Date().toISOString().slice(0,10)}`;
          const fileName = exportFileName.trim() || defaultName;
          let blob, ext;

          if (exportType === 'json') {
            blob = new Blob([jsonString], { type: 'application/json' });
            ext = '.json';
          } else {
            blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            ext = '.csv';
          }

          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${fileName}${ext}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          
          setLastSavedData(JSON.stringify({
            projectName,
            incomes,
            expenses,
            categories: expenseCategories,
            salesRatio,
            subsidyAmount,
            memberCount,
            perMemberFee
          }));
          setIsDirty(false);
          
          setShowExportModal(false);
          setShowMessageModal({ show: true, title: '保存成功', message: 'ファイルをダウンロードしました。' });
        } catch (error) {
          setShowMessageModal({ show: true, title: 'エラー', message: 'ファイルの保存またはコピーに失敗しました。' });
        }
      };

      const triggerFileInput = () => {
        if (fileInputRef.current) fileInputRef.current.click();
        setShowImportModal(false);
      };

      const processImportedData = (dataStr) => {
        try {
          const importedData = JSON.parse(dataStr);
          if (importedData.incomes && importedData.expenses) {
            const nextProjectName = importedData.projectName || '';
            const nextCategories = importedData.categories || INITIAL_CATEGORIES;
            const nextRatio = importedData.salesRatio !== undefined ? importedData.salesRatio : 100;
            const nextSubsidy = importedData.subsidyAmount !== undefined ? importedData.subsidyAmount : 10000;
            const nextMembers = importedData.memberCount !== undefined ? importedData.memberCount : 25;
            const nextFee = importedData.perMemberFee !== undefined ? importedData.perMemberFee : 1000;

            setProjectName(nextProjectName);
            setIncomes(importedData.incomes);
            setExpenses(importedData.expenses);
            setExpenseCategories(nextCategories);
            setSalesRatio(nextRatio);
            setSubsidyAmount(nextSubsidy);
            setMemberCount(nextMembers);
            setPerMemberFee(nextFee);
            
            setLastSavedData(JSON.stringify({ 
              projectName: nextProjectName,
              incomes: importedData.incomes, 
              expenses: importedData.expenses, 
              categories: nextCategories, 
              salesRatio: nextRatio,
              subsidyAmount: nextSubsidy,
              memberCount: nextMembers,
              perMemberFee: nextFee
            }));
            setIsDirty(false);
            
            setShowImportModal(false);
            setImportText('');
            setShowMessageModal({ show: true, title: '読込成功', message: 'データを正常に読み込みました。' });
          } else { throw new Error('Invalid format'); }
        } catch (error) {
          setShowMessageModal({ show: true, title: 'エラー', message: 'データの読み込みに失敗しました。バックアップ(JSON)形式か確認してください。' });
        }
      };

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          processImportedData(event.target.result);
          e.target.value = '';
        };
        reader.readAsText(file);
      };

      const handleImportText = () => {
        if (!importText.trim()) return;
        processImportedData(importText);
      };

      const handleReset = () => {
        safeStorage.removeItem('festival_incomes');
        safeStorage.removeItem('festival_expenses');
        safeStorage.removeItem('festival_categories');
        safeStorage.removeItem('festival_meta');
        handleInitializeData();
        setShowResetModal(false);
        setShowMessageModal({ show: true, title: '初期化完了', message: 'データを初期状態にリセットしました。' });
      };

      const getPieChartGradient = () => {
        let cumulativePercent = 0;
        const gradients = categorySummary.filter(cat => cat.total > 0).map((cat, idx) => {
          const percent = (cat.total / calculations.totalExpense) * 100;
          const start = cumulativePercent;
          const end = cumulativePercent + percent;
          cumulativePercent += percent;
          return `${CHART_COLORS[idx % CHART_COLORS.length].hex} ${start}% ${end}%`;
        });
        return gradients.length > 0 ? `conic-gradient(${gradients.join(', ')})` : 'conic-gradient(#e2e8f0 0% 100%)';
      };

        return expenses.filter(item => item.category === expenseFilterCategory);

      return (

                <div className="flex items-center gap-2.5">

                  <div>

                </div>
                {isDirty && (

              <div className="flex flex-wrap justify-center items-center gap-2 w-full lg:w-auto">
                {isDirty && (

                      : 'bg-white/10 hover:bg-white/20 border-white/20 text-slate-300'
                  }`}
                  title={warnOnReload ? 'リロード防止警告：有効（クリックで無効化）' : 'リロード防止警告：無効（クリックで有効化）'}

                  <span>{warnOnReload ? '離脱警告: ON' : '離脱警告: OFF'}</span>
                </button>

                <button

                >
                  <Upload className="w-4 h-4" /> 読込
                </button>

                <button

            </div>
          )}

          {/* インポートモーダル */}
          {showImportModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-[200] no-print">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-black text-slate-800">データの読み込み</h3>
                  <button onClick={() => setShowImportModal(false)} className="text-slate-400 hover:text-slate-600 bg-slate-50 hover:bg-slate-100 p-1.5 rounded-lg transition-colors"><X className="w-5 h-5" /></button>
                </div>
                
                <div className="space-y-6">
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                    <FileJson className="w-8 h-8 text-indigo-500 mx-auto mb-2" />
                    <p className="text-sm font-bold text-slate-700 mb-3">バックアップファイル (.json) から復元</p>
                    <button onClick={triggerFileInput} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-sm font-bold transition-colors w-full shadow-sm">
                      ファイルを選択して読込
                    </button>
                  </div>

                  <div className="relative">
                    <div className="absolute inset-0 flex items-center" aria-hidden="true"><div className="w-full border-t border-slate-200"></div></div>
                    <div className="relative flex justify-center"><span className="px-2 bg-white text-xs text-slate-400 font-bold">または</span></div>
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-slate-600 mb-2 flex items-center gap-1.5"><ClipboardPaste className="w-4 h-4" /> テキストを貼り付けて復元</label>
                    <textarea 
                      value={importText} 
                      onChange={(e) => setImportText(e.target.value)} 
                      placeholder='コピーしたJSONデータをここに貼り付け ( {"version":"1.4", ...} )'
                      className="w-full h-24 p-3 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all resize-none font-mono text-slate-600"
                    ></textarea>
                    <button 
                      onClick={handleImportText} 
                      disabled={!importText.trim()}
                      className={`mt-2 w-full py-2.5 rounded-lg text-sm font-bold transition-colors shadow-sm ${importText.trim() ? 'bg-slate-800 hover:bg-slate-900 text-white' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}
                    >
                      テキストからデータを読込
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 初期化モーダル */}
          {showResetModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-[200] no-print">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100">
                <h3 className="text-xl font-black text-slate-800 mb-2">データを初期化しますか？</h3>
                <p className="text-slate-500 mb-6 text-sm font-medium">入力したすべてのデータとカテゴリ設定が消去され、初期状態に戻ります。この操作は取り消せません。</p>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setShowResetModal(false)} className="px-5 py-2.5 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 font-bold text-sm transition-colors">キャンセル</button>
                  <button onClick={handleReset} className="px-5 py-2.5 bg-red-500 hover:bg-red-600 text-white rounded-lg font-bold text-sm shadow-sm transition-colors">初期化する</button>
                </div>
              </div>
            </div>
          )}

          {/* カテゴリ編集モーダル */}
          {showCategoryModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-[200] no-print">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 max-h-[90vh] flex flex-col border border-slate-100">
                <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                  <h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><Settings className="w-5 h-5 text-slate-400" /> 経費カテゴリの編集</h3>
                  <button onClick={() => setShowCategoryModal(false)} className="text-slate-400 hover:text-slate-600 bg-slate-50 hover:bg-slate-100 p-1.5 rounded-lg transition-colors"><X className="w-5 h-5" /></button>
                </div>
                <div className="overflow-y-auto flex-1 space-y-3 pr-2">
                  {expenseCategories.map((cat, idx) => (
                    <div key={idx} className="flex gap-2 items-center">
                      <span className="text-slate-300 font-black text-xs w-4">{idx + 1}</span>
                      <input type="text" value={cat} onChange={(e) => {
                        const newCats = [...expenseCategories];
                        const oldVal = newCats[idx];
                        newCats[idx] = e.target.value;
                        setExpenseCategories(newCats);
                        setExpenses(expenses.map(exp => exp.category === oldVal ? { ...exp, category: e.target.value } : exp));
                      }} className="flex-1 p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none text-sm font-bold text-slate-700 transition-all" />
                      <button onClick={() => {
                          const catToRemove = expenseCategories[idx];
                          setExpenseCategories(expenseCategories.filter((_, i) => i !== idx));
                          setExpenses(expenses.map(exp => exp.category === catToRemove ? { ...exp, category: '未分類' } : exp));
                      }} className="p-2.5 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"><Trash2 className="w-4 h-4" /></button>
                    </div>
                  ))}
                  <button onClick={() => setExpenseCategories([...expenseCategories, `新規カテゴリ ${expenseCategories.length + 1}`])} className="w-full py-3 mt-4 border-2 border-dashed border-indigo-200 text-indigo-600 hover:bg-indigo-50 font-bold rounded-xl flex items-center justify-center gap-2 text-sm transition-colors"><Plus className="w-4 h-4" /> カテゴリを追加</button>
                </div>
                <div className="mt-6 pt-4 border-t border-slate-100 flex justify-end">
                  <button onClick={() => setShowCategoryModal(false)} className="w-full sm:w-auto px-8 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-bold text-sm shadow-sm transition-colors">完了</button>
                </div>
              </div>
            </div>
          )}

          {/* メッセージ案内モーダル */}
          {showMessageModal.show && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-[200] no-print">
              <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center border border-slate-100">
                <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-indigo-50 mb-4">
                  <Info className="h-6 w-6 text-indigo-500" />
                </div>
                <h3 className="text-lg font-black text-slate-800 mb-2">{showMessageModal.title}</h3>
                <p className="text-sm text-slate-500 font-medium mb-6 leading-relaxed">{showMessageModal.message}</p>
                <button onClick={() => setShowMessageModal({ show: false, title: '', message: '' })} className="w-full px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-bold shadow-sm transition-colors">閉じる</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
